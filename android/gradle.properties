org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableR8.fullMode=true
org.gradle.java.home=/Library/Java/JavaVirtualMachines/openjdk-17.jdk/Contents/Home
# Play Console "optimized resource shrinking" recommendation (default in
# AGP 9, kept explicit so a future AGP downgrade does not silently lose it).
android.enableNewResourceShrinker.preciseShrinking=true
# AGP 9 built-in Kotlin (docs.flutter.dev/release/breaking-changes/migrate-to-built-in-kotlin).
android.builtInKotlin=true
# Old DSL kept: the root build.gradle.kts patches plugin namespaces /
# compileSdk through BaseExtension / LibraryExtension (isar_flutter_libs).
android.newDsl=false
# ABI filtering is done in app/build.gradle.kts from --target-platform
# (Flutter's own filter always packages all three ABIs).
disable-abi-filtering=true
