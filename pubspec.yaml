name: kuber
description: "Kuber, a local-first expense manager"
publish_to: 'none'
version: 6.0.0+60

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  collection: ^1.19.0

  # State management
  flutter_riverpod: ^2.6.1

  # Local database
  isar_community: ^3.3.2
  isar_community_flutter_libs: ^3.3.2
  path_provider: ^2.1.5

  # Navigation
  go_router: ^14.8.1

  # Authentication
  local_auth: ^2.3.0

  # Theming. material_color_utilities ships inside the Flutter SDK already
  # (HCT re-toning of user category colours); listed so it can be imported.
  material_color_utilities: any
  # "From your wallpaper" theme (Android 12+ seed), as in Mull.
  dynamic_color: ^1.7.0
  google_fonts: ^8.0.2

  # Utilities
  intl: ^0.20.2
  shared_preferences: ^2.5.3
  permission_handler: ^12.0.1
  # On-device speech-to-text for Quick Add voice input (offline, streaming,
  # exposes mic amplitude for the waveform). No comparable in-repo alternative.
  speech_to_text: ^7.0.0
  csv: ^8.0.0
  file_picker: ^11.0.1
  share_plus: ^12.0.1
  device_info_plus: ^12.3.0
  flutter_local_notifications: ^21.0.0
  pdf: ^3.11.0

  uuid: ^4.5.1
  http: ^1.2.0

  # Charts
  fl_chart: ^1.2.0
  shimmer: ^3.0.0

  package_info_plus: ^8.0.0
  url_launcher: ^6.3.1
  image_picker: ^1.2.1
  path: ^1.9.1
  open_filex: ^4.7.0
  flutter_quill: ^11.5.0
  timezone: ^0.11.1

  # Kuber Cards vault: on-device field encryption. Argon2id KDF + AES-GCM-256,
  # clean async API, pure Dart (works on Android + Web). See specs/plans/kuber-cards.md.
  cryptography: ^2.7.0

  # Monochrome, tintable bank-mark SVGs for the Kuber Cards icon picker. Vector
  # keeps the ~40 marks well under the 300 KB asset budget.
  flutter_svg: ^2.0.17

  # Native Android home-screen widgets (Flutter <-> RemoteViews bridge)
  home_widget: ^0.7.0

  # Google Play Billing (Kuber Pro subscriptions + Buy Me a Coffee).
  # The Android implementation (in_app_purchase_android) is used transitively;
  # it is imported directly in a couple of billing files to read subscription
  # offer tokens / pricing phases (with a depend_on_referenced_packages ignore),
  # so it is intentionally NOT listed here as a direct dependency.
  in_app_purchase: ^3.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.13
  isar_community_generator: ^3.3.2
  mocktail: ^1.0.4
  fake_async: ^1.3.2
  # Generates the native launch screen (pre-12 layer list + Android 12
  # SplashScreen styles) from assets/icon/, as PostPurush does. Dev-only:
  # nothing ships in the APK but the generated res/ files.
  flutter_native_splash: ^2.4.8

flutter:
  uses-material-design: true
  generate: true

  assets:
    # Monochrome, tintable bank-mark SVGs for the Kuber Cards icon picker.
    - assets/bank_icons/
    # Pre-bundled Inter weights (subset to Latin + punctuation + currency/
    # arrow/symbol ranges). google_fonts loads these from assets before any
    # network fetch, so the primary UI font is available instantly and offline.
    # Playfair Display (About screen only) still lazy-fetches.
    - assets/google_fonts/
    - assets/fonts/JetBrainsMono-OFL.txt

  # JetBrains Mono is an engine-registered font, not a google_fonts runtime
  # load: a runtime FontLoader.load parses on the UI thread and then fires
  # fontsChange, which relayouts the whole route stack (measured 25 ms stall +
  # 24 ms build on first open of the SMS Import screen). Use `monoFont()` from
  # core/utils/locale_font.dart, never GoogleFonts.jetBrainsMono.
  fonts:
    # About page editorial accents (board 3.13), bundled for the same reason.
    # OFL, see assets/fonts/InstrumentSerif-OFL.txt.
    - family: InstrumentSerif
      fonts:
        - asset: assets/fonts/InstrumentSerif-Italic.ttf
          style: italic
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Regular.ttf
          weight: 400
        - asset: assets/fonts/JetBrainsMono-Medium.ttf
          weight: 500
        - asset: assets/fonts/JetBrainsMono-SemiBold.ttf
          weight: 600

# Launcher icon: the board's adaptive vector drawables live in res/drawable/
# (copied verbatim from specs/design/.../icon/android). `flutter_launcher_icons`
# is deliberately not used, it would rasterise them and lose the themed
# (monochrome) layer. Legacy PNGs and the splash art come from
# `flutter test tool/generate_icons_test.dart`.
flutter_native_splash:
  # The icon's own ground (icon.md): the splash reads as the launcher icon
  # holding still. Dark mode uses the board's T10 ground and T80/T60 strokes.
  color: "#D8E2FF"
  color_dark: "#001A42"
  image: assets/icon/splash.png
  image_dark: assets/icon/splash_dark.png
  android_12:
    # Android 12 masks its splash icon to a circle and shows only the middle of
    # it, so this art is the glyph alone on transparent and the ground is the
    # colour below.
    image: assets/icon/splash_android12.png
    image_dark: assets/icon/splash_android12_dark.png
    icon_background_color: "#D8E2FF"
    icon_background_color_dark: "#001A42"
    color: "#D8E2FF"
    color_dark: "#001A42"
  android: true
  ios: false
  web: false
